name: MotoTrip Verified TWA Fullscreen Emulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/twa-fullscreen-test.yml'
      - 'tests/verify-twa-android.py'

permissions:
  contents: write

concurrency:
  group: mototrip-fullscreen-verified-test
  cancel-in-progress: false

jobs:
  signed-twa:
    name: Test release variant with disposable signing certificate
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout root domain
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Checkout MotoTrip Android
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mototrip/Trip-Planner
          ref: main
          path: trip
      - name: Install Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
      - name: Install SDK and signing tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Create disposable CI-only signed-release certificate
        shell: bash
        run: |
          set -euo pipefail
          pw=$(openssl rand -hex 24)
          echo "::add-mask::$pw"
          k="$RUNNER_TEMP/mototrip-ci-only.jks"
          keytool -genkeypair -alias ci_test_only -storetype JKS -keyalg RSA \
            -keysize 3072 -validity 2 -dname "CN=MotoTrip TWA CI Test Only" \
            -keystore "$k" -storepass "$pw" -keypass "$pw" -noprompt
          chmod 600 "$k"
          fp=$(keytool -list -v -keystore "$k" -storepass "$pw" \
            -alias ci_test_only | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)
          [[ "$fp" =~ ^([A-F0-9]{2}:){31}[A-F0-9]{2}$ ]]
          echo "TEST_FINGERPRINT=$fp" >> "$GITHUB_ENV"
          echo "MOTOTRIP_SIGNING_STORE_FILE=$k" >> "$GITHUB_ENV"
          echo "MOTOTRIP_SIGNING_STORE_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "MOTOTRIP_SIGNING_KEY_ALIAS=ci_test_only" >> "$GITHUB_ENV"
          echo "MOTOTRIP_SIGNING_KEY_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "PUBLIC_TEMP_CERT_SHA256=$fp"
          echo "IMPORTANT_THIS_IS_NOT_THE_PRODUCTION_UPLOAD_KEY"

      - name: Temporarily add test SHA256 to root Digital Asset Links
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          p='.well-known/assetlinks.json'
          data=json.load(open(p))
          t=next((x['target'] for x in data if x.get('target',{}).get('package_name')=='com.mototrip.app.twa'),None)
          assert t
          fp=os.environ['TEST_FINGERPRINT']
          assert fp not in t['sha256_cert_fingerprints']
          assert '7D:32:2C:77:EB:72:D0:E4:5A:4A:A8:2A:D5:FC:0A:B5:DA:5D:0A:16:B9:61:05:CC:8B:74:B7:31:9A:56:64:FE' in t['sha256_cert_fingerprints']
          t['sha256_cert_fingerprints'].append(fp)
          open(p,'w').write(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .well-known/assetlinks.json
          git commit -m "TWA CI: temporary test-only certificate"
          git push origin HEAD:main
          echo 'TEMP_ROOT_CERT_COMMIT=PASS'

      - name: Build release APK and verify certificate matches root DAL
        working-directory: trip/android-app
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :app:assembleRelease --no-daemon --stacktrace
          apk=app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify -v --print-certs "$apk" \
            > "$RUNNER_TEMP/signature-report.txt"
          expected=$(printf '%s' "$TEST_FINGERPRINT" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          grep -qi "certificate SHA-256 digest: $expected" "$RUNNER_TEMP/signature-report.txt"
          echo 'RELEASE_VARIANT_APK_SIGNED_AND_MATCHES_DAL=PASS'

      - name: Wait for real HTTPS root to serve test certificate
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 36); do
            if curl -fsSL --max-time 12 --header 'Cache-Control: no-cache' \
              "https://mototrip.github.io/.well-known/assetlinks.json?ci=$GITHUB_RUN_ID-$i" \
              -o "$RUNNER_TEMP/assetlinks-live.json"; then
              if python3 -c 'import json,os,sys; d=json.load(open(sys.argv[1])); sys.exit(0 if any(os.environ["TEST_FINGERPRINT"] in x.get("target",{}).get("sha256_cert_fingerprints",[]) for x in d) else 1)' "$RUNNER_TEMP/assetlinks-live.json"; then
                ok=1
                break
              fi
            fi
            sleep 10
          done
          test "$ok" = 1 || { echo '::error::Temporary root certificate not deployed'; exit 1; }
          echo 'LIVE_HTTPS_ROOT_TEMP_CERT=PASS'

      - name: Allow virtual-phone hardware acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test Chrome URL-bar-free TWA on Pixel 7 Android 15
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_7
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 tests/verify-twa-android.py

      - name: Remove disposable certificate from public site
        if: always()
        shell: bash
        run: |
          set -eo pipefail
          if [ -n "$TEST_FINGERPRINT" ]; then
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json,os
          p='.well-known/assetlinks.json'
          data=json.load(open(p))
          cert=os.environ['TEST_FINGERPRINT']
          for x in data:
            t=x.get('target',{})
            if t.get('package_name')=='com.mototrip.app.twa':
              t['sha256_cert_fingerprints']=[v for v in t['sha256_cert_fingerprints'] if v != cert]
              assert t['sha256_cert_fingerprints']
          open(p,'w').write(json.dumps(data,indent=2)+'\n')
          PY
            if ! git diff --quiet -- .well-known/assetlinks.json; then
              git add .well-known/assetlinks.json
              git commit -m "TWA CI: remove temporary test certificate"
              git push origin HEAD:main
            fi
            echo 'TEMP_CERT_REMOVED_FROM_ROOT_REPO=PASS'
          fi
          rm -f "$RUNNER_TEMP/mototrip-ci-only.jks"

      - name: Upload real Pixel screenshots and logcat results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotoTrip-TWA-SignedTest-Emulator-Evidence
          path: twa-emulator-results/
          if-no-files-found: warn
